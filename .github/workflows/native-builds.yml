name: Native SwiftEdit dogfood builds
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
          - runner: windows-2022
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Linux build and native runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth patchelf
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python git
      - name: Build and test Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python -B tools/Build-Native.py --platform windows-x64
      - name: Build, test and package macOS
        if: runner.os == 'macOS'
        run: python3 -B tools/Build-Native.py --platform macos-arm64
      - name: Build and test Linux with owned virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 -B tools/Build-Native.py --platform linux-x64
      - name: Upload platform dogfood download
        uses: actions/upload-artifact@v4
        with:
          name: SwiftEdit-${{ matrix.platform }}
          path: .build/native-${{ matrix.platform }}/dist/*
          if-no-files-found: error
      - name: Preserve native test and package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.platform }}
          path: |
            .build/native-${{ matrix.platform }}/Testing/Temporary/
            .build/native-${{ matrix.platform }}/mac-package-*/startup.log
            .build/native-${{ matrix.platform }}/mac-package-*/idle-stack*.txt
            .build/native-${{ matrix.platform }}/native-visual-*/*.png
            .build/native-${{ matrix.platform }}/terminal-end-evidence/summary.txt
            .build/native-${{ matrix.platform }}/terminal-end-evidence/receipt.json
            .build/native-${{ matrix.platform }}/terminal-end-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/search-evidence/summary.txt
            .build/native-${{ matrix.platform }}/search-evidence/receipt.json
            .build/native-${{ matrix.platform }}/search-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/text-copy-evidence/summary.txt
            .build/native-${{ matrix.platform }}/text-copy-evidence/receipt.json
            .build/native-${{ matrix.platform }}/text-copy-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/navigation-evidence/summary.txt
            .build/native-${{ matrix.platform }}/navigation-evidence/receipt.json
            .build/native-${{ matrix.platform }}/navigation-evidence/fixtures/samples.csv
          if-no-files-found: ignore

  release:
    name: Publish validated cross-platform prerelease
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SwiftEdit-*
          path: release-assets
      - name: Publish immutable commit download set
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/Publish-Release.py --artifacts release-assets
